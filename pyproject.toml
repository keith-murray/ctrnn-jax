[project]
name = "ctrnn-jax"
version = "0.1.0"
description = "An implementation of continuous-time recurrent neural networks in the Jax ecosystem"
authors = [
    {name = "Keith T. Murray", email = "murraykeith64@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax==0.4.31",
    "flax==0.9.0",
    "matplotlib>=3.9.2",
    "clu>=0.0.12",
    "tqdm>=4.66.5",
    "scikit-learn>=1.6.0",
    "jax-dataloader>=0.1.4",
]

[dependency-groups]
dev = [
    "pre-commit>=3.8.0",
    "pylint>=3.2.6",
    "pytest>=8.3.2",
    "black>=24.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
